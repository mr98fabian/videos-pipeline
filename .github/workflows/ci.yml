name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  verify:
    # nombre estable: es el check que exige la protección de rama
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==9.0.2
      - name: verify.py (lint de guiones, formato, tests, escudo)
        run: python scripts/verify.py --ci --base "origin/${{ github.base_ref || 'master' }}"
